services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: axon
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "axon", "-d", "axon"]
      interval: 2s
      timeout: 3s
      retries: 15

  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["local-ai"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  planning-worker:
    build: .
    profiles: ["local-ai"]
    command: ["python", "-m", "app.planner.worker"]
    restart: unless-stopped
    environment:
      AXON_PLANNING_METRICS_PORT: "9101"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      AXON_DATABASE_HOST: db
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  api:
    build: .
    profiles: ["local-ai"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      AXON_DATABASE_HOST: db
      AXON_APPROVAL_TOKEN: "${AXON_APPROVAL_TOKEN:-}"
      OLLAMA_BASE_URL: http://ollama:11434
      AXON_TRACE_EXPORT: "${AXON_TRACE_EXPORT:-off}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      planning-worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  ollama_models:
