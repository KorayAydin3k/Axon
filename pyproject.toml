[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.13,<2", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[project.optional-dependencies]
test = ["httpx2>=2,<3", "pytest>=8.4,<10", "starlette>=1.10,<2"]
